[build-system]
requires = ["setuptools>=61,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosseval"
version = "0.0.6"
description = "Cross-validation summary tools for classifier evaluation."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Maxim Zaslavsky", email = "maxim@maximz.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "Click>=7.0",
    "enum-mixins",
    "genetools>=0.7.5",
    "joblib",
    "kdict",
    "matplotlib",
    "multiclass-metrics",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "sentinels",
    "typer",
]

[project.urls]
Homepage = "https://github.com/maximz/crosseval"
Documentation = "https://crosseval.maximz.com"

[project.scripts]
plotconfusion = "crosseval.scripts.plot_confusion_matrix:app"

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "coverage>=7.2.2",
    "furo==2024.1.29",
    "pip>=19.2.3",
    "pre-commit>=2.15.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "recommonmark>=0.6.0",
    "requests>=2.28.0",
    "ruff>=0.2.2",
    "setuptools>=61,<77",
    "sphinx>=6.0",
    "wheel>=0.33.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["crosseval", "crosseval.*"]
